name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The tests import the scripts' real dependencies and stub their
      # behaviour, so the packages must be installed. torch comes from the
      # CPU-only index to avoid the CUDA wheels.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt \
            numpy requests pyyaml playwright faiss-cpu sentence-transformers
          # tests/pubmed asserts the reindex workflow does not depend on
          # hf_xet; huggingface_hub installs it, so remove it again.
          python -m pip uninstall --yes hf_xet

      - name: Test (coverage gate from pytest.ini)
        run: pytest
